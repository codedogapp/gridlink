name: gridlink-aggrid-demo

services:
  opensearch:
    image: opensearchproject/opensearch:3
    container_name: gridlink-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # Required by the image bootstrap even though the security plugin is disabled above.
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Gridlink_Demo_2026!
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"   # REST API (http, no TLS since security is disabled)
      - "9600:9600"   # performance analyzer
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
