name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Core is framework-agnostic: build and test it once.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - run: mvn -B -pl gridlink-core -am verify

  # Single source of truth for supported spring-data-elasticsearch lines lives in
  # ci/spring-data-elasticsearch-versions.json (a JSON array). Expose it as a job
  # output so the adapter-matrix job can fan out over it via fromJSON.
  versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: echo "matrix=$(cat ci/spring-data-elasticsearch-versions.json)" >> "$GITHUB_OUTPUT"

  # Prove the single adapter artifact works across the supported spring-data-elasticsearch lines:
  #   5.x -> Spring Boot 3, 6.x -> Spring Boot 4. Same sources, different runtime version.
  adapter-matrix:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spring-data-elasticsearch: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '21'
          cache: maven
      - name: Test against spring-data-elasticsearch ${{ matrix.spring-data-elasticsearch }}
        run: >-
          mvn -B -pl gridlink-elasticsearch -am verify
          -Dspring-data-elasticsearch.version=${{ matrix.spring-data-elasticsearch }}
