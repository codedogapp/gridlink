[tools]
java = 'corretto-21'
maven = "latest"

[tasks."ci:core"]
description = "'core' job: build & test gridlink-core"
run = "mvn -B -pl gridlink-core -am verify"

[tasks."ci:matrix"]
description = "'adapter-matrix': verify the adapter against every supported spring-data-elasticsearch line"
run = """
#!/usr/bin/env bash
set -uo pipefail
list="ci/spring-data-elasticsearch-versions.json"
failed=""
tested=""
for v in $(jq -r '.[]' "$list"); do
  echo "==> spring-data-elasticsearch ${v}"
  if ! mvn -B -pl gridlink-elasticsearch -am verify -Dspring-data-elasticsearch.version="${v}"; then
    failed="${failed} ${v}"
  fi
  tested="${tested} ${v}"
done
echo
if [ -n "${failed}" ]; then
  echo "matrix FAILED for:${failed}"
  exit 1
fi
echo "matrix OK for:${tested}"
"""

[tasks.test]
description = "Run full tests suite with compatability matrix"
depends = ["ci:core", "ci:matrix"]

[tasks."docs:serve"]
description = "Serve the docs guide + API reference locally at http://127.0.0.1:4000/gridlink/"
dir = "docs"
tools = { ruby = "4.0" }
run = """
#!/usr/bin/env bash
set -euo pipefail
port="${PORT:-4000}"
if lsof -nP -iTCP:"${port}" -sTCP:LISTEN >/dev/null 2>&1; then
  pid="$(lsof -nP -tiTCP:"${port}" -sTCP:LISTEN | head -1)"
  echo "Port ${port} is already in use (PID ${pid}) — a docs server is probably still running."
  echo "Stop it:  kill ${pid}   ·   or use another port:  PORT=4001 mise run docs:serve"
  exit 1
fi
bundle config set --local path vendor/bundle
bundle check >/dev/null 2>&1 || bundle install
exec bundle exec jekyll serve --host 127.0.0.1 --port "${port}"
"""

[tasks."docs:clean"]
description = "Remove generated docs output (Jekyll _site + caches)"
dir = "docs"
run = """
#!/usr/bin/env bash
set -euo pipefail
rm -rf _site .jekyll-cache .jekyll-metadata .sass-cache
echo "Cleaned docs: _site, .jekyll-cache, .jekyll-metadata, .sass-cache"
"""